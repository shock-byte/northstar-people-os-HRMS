spring.application.name=northstar-people-os-api

# SQLite datasource
spring.datasource.url=jdbc:sqlite:./hrms.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Hibernate dialect for SQLite (from hibernate-community-dialects)
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Server configuration
server.port=8080

# CORS (will also configure in WebMvc for fine-grained control)
app.security.demo-users.admin.username=${HRMS_ADMIN_USERNAME:admin}
app.security.demo-users.admin.password=${HRMS_ADMIN_PASSWORD:admin123}
app.security.demo-users.hr.username=${HRMS_HR_USERNAME:hr}
app.security.demo-users.hr.password=${HRMS_HR_PASSWORD:hr123}
app.security.demo-users.employee.username=${HRMS_EMPLOYEE_USERNAME:employee}
app.security.demo-users.employee.password=${HRMS_EMPLOYEE_PASSWORD:emp123}

app.demo.seed.enabled=${HRMS_DEMO_SEED:true}
