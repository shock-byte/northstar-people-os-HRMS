<div class="login-page" [class.login-page--password]="isPasswordFocus">
  <div class="login-glow"></div>

  <div class="login-wrapper">
    <div class="login-visual">
      <div class="login-avatar" [class.login-avatar--look-away]="isPasswordFocus">
        <div class="login-avatar__face">
          <span class="login-avatar__eye login-avatar__eye--left"></span>
          <span class="login-avatar__eye login-avatar__eye--right"></span>
        </div>
      </div>
      <h1 class="login-title">Welcome to HRMS</h1>
      <p class="login-subtitle">
        Sign in to manage employees, leave, attendance and payroll.
      </p>
    </div>

    <mat-card class="login-card">
      <mat-card-content>
        <form [formGroup]="form" (ngSubmit)="submit()">
          <mat-form-field appearance="fill" class="full-width">
            <mat-label>Username</mat-label>
            <input
              matInput
              formControlName="username"
              (input)="onUsernameInput()"
              (focus)="onUsernameFocus()"
              (blur)="onUsernameBlur()"
            >
          </mat-form-field>

          <mat-form-field appearance="fill" class="full-width">
            <mat-label>Password</mat-label>
            <input
              matInput
              type="password"
              formControlName="password"
              (focus)="onPasswordFocus()"
              (blur)="onPasswordBlur()"
            >
          </mat-form-field>

          <button
            mat-raised-button
            color="primary"
            type="submit"
            class="login-button"
            [disabled]="form.invalid"
          >
            Login
          </button>
        </form>
      </mat-card-content>
    </mat-card>
  </div>
</div>
