<mat-card>
  <mat-card-title>Attendance</mat-card-title>
  <mat-card-content>
    <table mat-table [dataSource]="records" class="mat-elevation-z1">
      <ng-container matColumnDef="employee">
        <th mat-header-cell *matHeaderCellDef>Employee</th>
        <td mat-cell *matCellDef="let r">{{ r.employeeName }}</td>
      </ng-container>

      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef>Date</th>
        <td mat-cell *matCellDef="let r">{{ r.workDate }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let r">{{ r.status }}</td>
      </ng-container>

      <ng-container matColumnDef="checkIn">
        <th mat-header-cell *matHeaderCellDef>Check-in</th>
        <td mat-cell *matCellDef="let r">{{ r.checkInTime }}</td>
      </ng-container>

      <ng-container matColumnDef="checkOut">
        <th mat-header-cell *matHeaderCellDef>Check-out</th>
        <td mat-cell *matCellDef="let r">{{ r.checkOutTime }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let r">
          <button mat-button color="warn" (click)="delete(r)">Delete</button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </mat-card-content>
</mat-card>

<mat-card class="form-card">
  <mat-card-title>Record attendance</mat-card-title>
  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="save()">
      <div class="form-row">
        <mat-form-field appearance="fill">
          <mat-label>Employee</mat-label>
          <mat-select formControlName="employeeId">
            <mat-option *ngFor="let e of employees" [value]="e.id">
              {{ e.firstName }} {{ e.lastName }}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Date</mat-label>
          <input matInput [matDatepicker]="datePicker" formControlName="workDate">
          <mat-datepicker-toggle matSuffix [for]="datePicker"></mat-datepicker-toggle>
          <mat-datepicker #datePicker></mat-datepicker>
        </mat-form-field>
      </div>

      <div class="form-row">
        <mat-form-field appearance="fill">
          <mat-label>Status</mat-label>
          <mat-select formControlName="status">
            <mat-option *ngFor="let s of statuses" [value]="s">
              {{ s }}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Check-in (HH:MM)</mat-label>
          <input matInput formControlName="checkInTime" placeholder="09:00">
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Check-out (HH:MM)</mat-label>
          <input matInput formControlName="checkOutTime" placeholder="17:00">
        </mat-form-field>
      </div>

      <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">
        Save
      </button>
    </form>
  </mat-card-content>
</mat-card>
